name: React migration checks

on:
  pull_request:
    paths:
      - 'launcher/**'
      - 'docs/react-migration/**'
      - '.github/workflows/react-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer:
    runs-on: windows-latest
    strategy:
      matrix:
        renderer: [vue, react]
    env:
      LAUNCHER_RENDERER: ${{ matrix.renderer }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: launcher/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types, lint and selector regressions
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run scripts/renderer.test.ts scripts/branding.test.ts xmcl-electron-app/main/utils/verifyUpdate.test.ts xmcl-react-ui/src packages/renderer-client xmcl-runtime/service/ServiceStateContainer.test.ts xmcl-runtime/service/ServiceStateManager.test.ts xmcl-runtime/user/UserService.persistence.test.ts xmcl-runtime/user/UserService.appearance.test.ts xmcl-runtime/user/pluginOfflineUser.test.ts xmcl-runtime/infra/image_store.test.ts xmcl-runtime/setup/bootstrapSession.test.ts xmcl-runtime/app/pluginMediaProtocol.test.ts xmcl-runtime/presentation xmcl-electron-app/main/utils/bootstrapSender.test.ts xmcl-keystone-ui/src/util/instanceName.test.ts packages/instance/files_handler.test.ts xmcl-runtime/instanceIO/InstanceInstallService.progressive.test.ts xmcl-runtime/instanceIO/InstanceInstallService.concurrent.test.ts xmcl-runtime-api/src/commands/instance/launch.test.ts xmcl-runtime-api/src/util/java.test.ts xmcl-runtime/java/JavaService.test.ts xmcl-runtime/java/java.test.ts packages/installer/javaInstallManifest.test.ts packages/installer/javaWorkflow.test.ts xmcl-keystone-ui/src/composables/instanceCreation.test.ts xmcl-runtime/instanceIO/utils/previewFolderFiles.test.ts xmcl-runtime/instanceIO/utils/linkInstanceFiles.test.ts xmcl-runtime/modpack/downloadModpackUrl.test.ts xmcl-runtime/instanceIO/utils/prismFolderVersion.test.ts xmcl-runtime/instanceIO/utils/importLauncherInstance.test.ts packages/instance/modpack.test.ts xmcl-runtime/instanceIO/utils/vanillaFolderVersion.test.ts packages/core/clientJar.test.ts packages/installer/clientJar.test.ts packages/installer/minecraft.test.ts xmcl-runtime/save/advancements.test.ts xmcl-runtime/util/importedClient.test.ts xmcl-runtime/instanceIO/utils/prismMinecraftBase.test.ts xmcl-runtime/util/mmcStandaloneVersion.test.ts xmcl-runtime/instance/InstanceService.operations.test.ts xmcl-runtime/instance/InstanceService.icon.test.ts xmcl-runtime/instance/instanceIcon.test.ts xmcl-runtime/instance/deleteInstance.race.test.ts packages/instance/duplicate.test.ts xmcl-runtime/modpack/reviewedExport.test.ts xmcl-runtime/modpack/exportArchiveFiles.test.ts xmcl-runtime/instance/instanceCopy.test.ts xmcl-runtime/instance/InstanceService.copy.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/react-migration.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/react-migration.mjs check
      - name: Build selected renderer and Windows host
        run: |
          pnpm build:renderer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --prefix xmcl-electron-app build
      - name: React package smoke
        if: matrix.renderer == 'react'
        run: |
          pnpm --dir e2e install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir e2e exec playwright install ffmpeg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:XMCL_E2E_EXECUTABLE=(Resolve-Path 'xmcl-electron-app/build/output/react/win-unpacked/Grimo Launcher.exe').Path
          $env:XMCL_E2E_LOCALES='es-ES'
          pnpm --dir e2e exec playwright test specs/react-migration/01-prototype.spec.ts specs/react-migration/02-packaged.spec.ts specs/react-migration/05-preferences-i18n.spec.ts specs/react-migration/06-accounts.spec.ts specs/react-migration/07-onboarding.spec.ts specs/react-migration/09-library.spec.ts specs/react-migration/10-creation.spec.ts specs/react-migration/11-onboarding-creation.spec.ts specs/react-migration/12-launch.spec.ts specs/react-migration/13-branding.spec.ts specs/react-migration/14-imports-advanced.spec.ts specs/react-migration/15-prism-version.spec.ts specs/react-migration/16-vanilla-version.spec.ts specs/react-migration/17-client-isolation.spec.ts specs/react-migration/18-prism-partial.spec.ts specs/react-migration/19-library-operations.spec.ts specs/react-migration/20-local-export.spec.ts specs/react-migration/21-group-management.spec.ts specs/react-migration/22-copy-recovery.spec.ts specs/react-migration/23-large-library.spec.ts specs/react-migration/24-shared-content.spec.ts specs/react-migration/25-profile-appearance.spec.ts specs/react-migration/26-instance-icons.spec.ts specs/react-migration/27-provider-covers.spec.ts --reporter=line
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:XMCL_REACT_CLIENT_HARNESS='1'
          pnpm --dir e2e exec playwright test specs/react-migration/04-client-contracts.spec.ts --reporter=line
      - name: Vue compatibility smoke
        if: matrix.renderer == 'vue'
        run: |
          pnpm --dir e2e install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir e2e exec playwright install ffmpeg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:XMCL_E2E_EXECUTABLE=(Resolve-Path 'xmcl-electron-app/build/output/win-unpacked/Grimo Launcher.exe').Path
          $env:XMCL_E2E_LOCALES='es-ES'
          pnpm --dir e2e exec playwright test specs/react-migration/03-vue-compatibility.spec.ts specs/react-migration/08-vue-onboarding.spec.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always() && matrix.renderer == 'react'
        with:
          name: react-migration-evidence
          path: launcher/e2e/artifacts
          retention-days: 7
