name: Deploy CurseForge proxy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: curseforge-proxy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/curseforge-proxy/package-lock.json
      - run: npm ci
        working-directory: services/curseforge-proxy
      - run: npm test
        working-directory: services/curseforge-proxy
      - run: npx wrangler deploy
        working-directory: services/curseforge-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
