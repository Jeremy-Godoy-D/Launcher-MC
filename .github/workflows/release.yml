name: Build & Publish Launcher MC Release

on:
  push:
    branches:
      - main
    paths:
      - 'launcher/package.json'
      - 'launcher/xmcl-electron-app/package.json'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate the current version's draft packages without replacing assets
        type: boolean
        default: false

concurrency:
  group: release-windows-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-windows:
    name: Windows x64 packages and migration validation
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: launcher/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: launcher
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Lint
        working-directory: launcher
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm lint

      - name: Test security boundaries
        working-directory: launcher
        run: |
          pnpm exec vitest run xmcl-keystone-ui/src/util/auroraTheme.test.ts xmcl-keystone-ui/src/util/theme.v1.test.ts xmcl-runtime/app/pluginApiFallback.test.ts xmcl-runtime/app/curseforgeProxy.test.ts xmcl-electron-app/main/utils/verifyUpdate.test.ts xmcl-electron-app/main/utils/windowsUpdate.test.ts xmcl-electron-app/main/ServerService.test.ts packages/curseforge/index.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run xmcl-keystone-ui/src/util/sanitizeHtml.test.ts xmcl-keystone-ui/src/composables/markdown.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test ../services/curseforge-proxy/worker.test.mjs

      - name: Verify production catalog proxy
        shell: pwsh
        env:
          CURSEFORGE_PROXY_URL: ${{ vars.CURSEFORGE_PROXY_URL }}
        run: |
          $proxy = [Uri]$env:CURSEFORGE_PROXY_URL
          if (-not $proxy.IsAbsoluteUri -or $proxy.Scheme -ne 'https' -or $proxy.UserInfo -or $proxy.AbsolutePath -ne '/' -or $proxy.Query -or $proxy.Fragment) { throw 'Configure a valid CURSEFORGE_PROXY_URL repository variable before release.' }
          $result = Invoke-WebRequest -Uri ($proxy.GetLeftPart([UriPartial]::Authority) + '/v1/mods/search?gameId=432&pageSize=1&classId=6') -TimeoutSec 15
          if ($result.StatusCode -ne 200) { throw 'CurseForge proxy is not ready.' }

      - name: Build Renderer (Vue UI)
        if: ${{ !inputs.validate_only }}
        working-directory: launcher
        run: pnpm build:renderer

      - name: Build Windows Installer (.exe), Portable (.zip) & ASAR Update
        if: ${{ !inputs.validate_only }}
        working-directory: launcher
        env:
          LAUNCHER_GITHUB_REPO: ${{ github.repository }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          CURSEFORGE_PROXY_URL: ${{ vars.CURSEFORGE_PROXY_URL }}
        run: pnpm build:all

      - name: Download unchanged draft packages for validation
        if: ${{ inputs.validate_only }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $out = 'launcher/xmcl-electron-app/build/output'
          $version = (Get-Content 'launcher/xmcl-electron-app/package.json' | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force $out | Out-Null
          gh release download "v$version" --pattern '*.zip*' --dir $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = "LauncherMC-$version-win-x64.zip"
          if ((Get-FileHash "$out/$name" -Algorithm SHA256).Hash -ne (Get-Content "$out/$name.sha256").Trim()) { throw 'Draft package checksum mismatch' }
          Expand-Archive -LiteralPath "$out/$name" -DestinationPath "$out/win-unpacked"

      - name: Verify published beta.3 migration baseline
        shell: pwsh
        run: |
          $baseline = 'launcher/e2e/artifacts/beta3'
          New-Item -ItemType Directory -Force $baseline | Out-Null
          Invoke-WebRequest 'https://github.com/Jeremy-Godoy-D/Launcher-MC/releases/download/v0.1.0-beta.3/LauncherMC-0.1.0-beta.3-win-x64.zip' -OutFile "$baseline/beta3.zip"
          if ((Get-FileHash "$baseline/beta3.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '47590518b18273811bb1118a02562d2d37b62d6a0b28efff903ae8a4fa75d301') { throw 'Published beta.3 checksum mismatch' }
          Expand-Archive -LiteralPath "$baseline/beta3.zip" -DestinationPath "$baseline/app"

      - name: Prepare Electron validation tools
        working-directory: launcher
        run: |
          pnpm e2e:install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --prefix=e2e exec playwright install ffmpeg

      - name: Validate Aurora against the actual packaged executable
        working-directory: launcher
        env:
          XMCL_LIVE_CURSEFORGE: '1'
          XMCL_E2E_EXECUTABLE: ${{ github.workspace }}\launcher\xmcl-electron-app\build\output\win-unpacked\Launcher MC.exe
        run: pnpm --prefix=e2e exec playwright test specs/aurora --output=artifacts/aurora-production

      - name: Validate packaged boot and beta.3 migration
        working-directory: launcher
        env:
          XMCL_BETA3_BINARY: ${{ github.workspace }}\launcher\e2e\artifacts\beta3\app\Launcher MC.exe
        run: pnpm test:e2e:release

      - name: Preserve Electron validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-validation
          path: |
            launcher/e2e/artifacts/aurora-production
            launcher/e2e/artifacts/test-results
            launcher/e2e/artifacts/test-results.json
            launcher/e2e/artifacts/screenshots
          retention-days: 7

      - name: Read version from package.json
        id: pkg
        shell: pwsh
        run: |
          $pkg = Get-Content "launcher/xmcl-electron-app/package.json" | ConvertFrom-Json
          $ver = $pkg.version
          $isPrerelease = $ver.Contains("-")
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Publish or Update GitHub Release
        if: ${{ !inputs.validate_only }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pkg.outputs.tag }}
          VERSION: ${{ steps.pkg.outputs.version }}
          IS_PRERELEASE: ${{ steps.pkg.outputs.prerelease }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $outDir = "launcher/xmcl-electron-app/build/output"
          $assets = Get-ChildItem "$outDir/*" -Include *.exe,*.zip,*.asar,*.gz,*.sha256,*.yml,manifest.json |
            Where-Object { $_.Name -notlike "*__uninstaller.exe" -and ($_.Name -like "*$env:VERSION*" -or $_.Name -eq 'manifest.json') } |
            Select-Object -ExpandProperty FullName

          # Legacy clients recognize app-*.asar; use new delta names before re-enabling them.
          $assets = @($assets | Where-Object { (Split-Path $_ -Leaf) -notlike 'app-*' -and (Split-Path $_ -Leaf) -ne 'builder-debug.yml' })
          if ($assets | Where-Object { $_ -match '\.asar' }) { throw 'This migration must not expose ASAR assets.' }
          foreach ($name in @("LauncherMC-$env:VERSION-win-x64.exe", "LauncherMC-$env:VERSION-win-x64.zip")) {
            if (-not ($assets | Where-Object { (Split-Path $_ -Leaf) -eq $name }) -or -not ($assets | Where-Object { (Split-Path $_ -Leaf) -eq "$name.sha256" })) { throw "Missing full-package artifact or checksum: $name" }
            $actual = (Get-FileHash "$outDir/$name" -Algorithm SHA256).Hash
            if ($actual -ne (Get-Content "$outDir/$name.sha256").Trim()) { throw "Full-package checksum mismatch: $name" }
          }

          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            # Create the tag with GITHUB_TOKEN so publishing the draft does not trigger a duplicate build.
            $tagCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:TAG" --jq .sha 2>$null
            if ($LASTEXITCODE -ne 0) {
              gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:TAG" -f "sha=$env:RELEASE_COMMIT" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Failed to create release tag.' }
            } elseif ($tagCommit -ne $env:RELEASE_COMMIT) { throw 'Release tag does not match the tested commit.' }
            $flags = @("--title", "Launcher MC $env:TAG", "--generate-notes", "--draft")
            if ($env:IS_PRERELEASE -eq "True" -or $env:IS_PRERELEASE -eq "true") {
              $flags += "--prerelease"
            }
            gh release create $env:TAG --target $env:RELEASE_COMMIT @flags
          } else {
            $isDraft = gh release view $env:TAG --json isDraft --jq .isDraft
            if ($isDraft -ne 'true') { throw 'Published releases are immutable. Use a new version.' }
          }

          foreach ($asset in $assets) {
            $uploaded = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release upload $env:TAG $asset --clobber
              if ($LASTEXITCODE -eq 0) {
                $uploaded = $true
                break
              }
              Start-Sleep -Seconds (2 * $attempt)
            }
            if (-not $uploaded) {
              throw "Failed to upload release asset: $asset"
            }
          }
